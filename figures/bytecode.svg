<rect x="0" y="16" width="262" height="160" rx="12" fill="#EAF1F4" stroke="#A7BCC4"/><text x="8" y="33" font-size="10px" font-weight="600" fill="#2E3A42" text-anchor="start" xml:space="preserve">ソース（Cart.total）</text>
<rect x="8" y="77" width="246" height="49" rx="3" fill="#C9DDE3"/>
<text x="14" y="56" font-size="10px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#222222" text-anchor="start" xml:space="preserve">public static long total(Item[] items) {</text>
<text x="14" y="72" font-size="10px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#222222" text-anchor="start" xml:space="preserve">    long sum = 0;</text>
<text x="14" y="88" font-size="10px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#222222" text-anchor="start" xml:space="preserve">    for (Item item : items) {</text>
<rect x="8" y="93" width="246" height="15" rx="2" fill="#00708F"/>
<text x="14" y="104" font-size="10px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#FFFFFF" text-anchor="start" xml:space="preserve">        sum += withTax(subtotal(item));</text>
<text x="14" y="120" font-size="10px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#222222" text-anchor="start" xml:space="preserve">    }</text>
<text x="14" y="136" font-size="10px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#222222" text-anchor="start" xml:space="preserve">    return sum;</text>
<text x="14" y="152" font-size="10px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#222222" text-anchor="start" xml:space="preserve">}</text>
